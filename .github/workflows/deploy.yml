name: CI/CD - Test & Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest -v

      - name: Check NLTK bootstrap
        run: |
          python tests/test_nltk_boot.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Trigger Render deployment
        run: |
          curl --request POST \
            --url https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
            --header "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "content-type: application/json"
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Wait for deployment
        run: |
          echo "Deployment triggered! Render will redeploy shortly..."
          sleep 10

      - name: Verify deployment (optional)
        continue-on-error: true
        run: |
          for i in {1..30}; do
            echo "Checking deployment status (attempt $i/30)..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://analyse-sentiment-api.onrender.com/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment successful! API is responding."
              exit 0
            fi
            echo "Status code: $HTTP_CODE. Waiting 5 seconds..."
            sleep 5
          done
          echo "⚠️ Deployment still in progress or API not ready yet."
