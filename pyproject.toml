[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-api"
version = "1.0.0"
description = "Sentiment analysis API using scikit-learn and LIME for explainability"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ESIEA MLOps Course", email = "info@esiea.fr"}
]
keywords = ["sentiment", "analysis", "api", "fastapi", "ml", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastapi==0.95.2",
    "uvicorn[standard]==0.22.0",
    "gunicorn==23.0.0",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "joblib==1.3.2",
    "pandas==2.2.2",
    "nltk==3.8.1",
    "lime==0.2.0.1",
    "requests==2.31.0",
    "python-multipart==0.0.6",
    "streamlit==1.28.0",
    "plotly==5.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-timeout==2.4.0",
    "pytest-cov==4.1.0",
]

[project.urls]
Repository = "https://github.com/Skeeder1/Analyse_sentiment_API"
Issues = "https://github.com/Skeeder1/Analyse_sentiment_API/issues"
Discussions = "https://github.com/Skeeder1/Analyse_sentiment_API/discussions"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
